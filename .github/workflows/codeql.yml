name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "17 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # mvnw tries the jar's download once and fails on any error; a cached jar is still
      # checked against wrapperSha256Sum before it runs. A run that cannot read the cache
      # (a tag, a first push to main, an evicted entry) downloads it, so the wrapper's first
      # start is retried (#128).
      - name: Read the Maven wrapper checksum
        if: matrix.language == 'java-kotlin'
        id: maven-wrapper
        run: echo "sha256=$(sed -n 's/^wrapperSha256Sum=//p' .mvn/wrapper/maven-wrapper.properties)" >> "$GITHUB_OUTPUT"
      - name: Cache the Maven wrapper jar
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mvn/wrapper/maven-wrapper.jar
          key: maven-wrapper-jar-${{ steps.maven-wrapper.outputs.sha256 }}
      - name: Start the Maven wrapper, retrying its download
        if: matrix.language == 'java-kotlin'
        run: ./scripts/ci/maven-wrapper-ready.sh
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build application
        if: matrix.language == 'java-kotlin'
        run: ./mvnw -B --no-transfer-progress clean package -DskipTests
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
