<!DOCTYPE html>
<html class="no-js" th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE">ReleaseFlow</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/svg/releaseflow-logo-mark.svg}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <script>
        (() => {
            document.documentElement.classList.remove('no-js');
            document.documentElement.classList.add('js');
            let saved = null;
            try { saved = localStorage.getItem('releaseflow:theme'); } catch (ignored) { }
            document.documentElement.dataset.theme = saved === 'dark' || saved === 'light'
                ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body class="theme-canvas min-h-screen">
<a href="#page-content" class="skip-link" th:text="#{ui.layout.skipToContent}">Skip to main content</a>

<div class="drawer lg:drawer-open" x-data="mobileNavigation()" @keydown.escape.window="close(true)">
    <input id="app-drawer" type="checkbox" class="drawer-toggle" x-model="open" tabindex="-1"
           th:aria-label="#{ui.layout.openNavigation}" aria-label="Open navigation">
    <div class="drawer-content min-w-0" :inert="open">
        <header class="app-header sticky top-0 z-30 flex h-16 items-center gap-3 border-b px-4 backdrop-blur lg:px-8">
            <button x-ref="trigger" type="button" class="icon-button lg:hidden" @click="show"
                    aria-controls="app-sidebar" :aria-expanded="open.toString()"
                    th:aria-label="#{ui.layout.openNavigation}" aria-label="Open navigation">
                <svg class="icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#menu}"></use></svg>
            </button>
            <div class="min-w-0 flex-1">
                <p class="truncate text-xs font-semibold uppercase tracking-wider text-slate-500"
                   th:text="#{ui.layout.workspace}">Workspace</p>
                <p class="truncate text-sm font-semibold" layout:fragment="page-title">ReleaseFlow</p>
            </div>
            <!--/* A GET form, so switching Project needs no JavaScript. The server remembers
                   the choice in a cookie; nothing here depends on browser storage. */-->
            <form method="get" class="hidden items-center gap-2 sm:flex" th:action="@{${projectSwitchPath}}"
                  th:unless="${#lists.isEmpty(projectSwitcher)}" novalidate>
                <label class="sr-only" for="project-switcher"
                       th:text="#{ui.overview.switchProjectLabel}">Switch project</label>
                <select id="project-switcher" name="project" class="select select-bordered select-sm max-w-48">
                    <option th:each="option : ${projectSwitcher}" th:value="${option.id()}"
                            th:text="${option.name()}" th:selected="${option.selected()}">Checkout</option>
                </select>
                <button type="submit" class="btn btn-outline btn-sm" th:text="#{ui.overview.switch}">Switch</button>
            </form>
            <button type="button" class="icon-button" x-data="themeToggle()" @click="toggle"
                    :aria-label="label" :title="label" th:aria-label="#{ui.layout.themeToggle}" aria-label="Toggle theme"
                    th:data-label-light="#{ui.layout.themeToLight}" th:data-label-dark="#{ui.layout.themeToDark}">
                <svg x-show="theme === 'light'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z"/>
                </svg>
                <svg x-show="theme === 'dark'" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" stroke-width="1.8"/><path stroke-linecap="round" stroke-width="1.8" d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
                </svg>
            </button>
            <div class="relative" th:if="${viewer != null}" x-data="userMenu()" @click.outside="close(false)"
                 @focusout="closeOnFocusOut($event)" @keydown.escape.stop.prevent="close(true)">
                <!--/* The name is the visible text plus a hidden phrase, so what a person sees is
                     part of what a screen reader announces (WCAG 2.5.3). */-->
                <button x-ref="trigger" type="button" class="btn btn-ghost gap-2 px-2" @click="toggle"
                        aria-controls="user-menu" :aria-expanded="open.toString()" aria-expanded="false">
                    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-indigo-100 text-sm font-bold text-indigo-700"
                          aria-hidden="true" th:text="${viewer.initial}">A</span>
                    <span class="hidden max-w-40 truncate text-sm md:block" th:text="${viewer.displayName}">Owner</span>
                    <span class="sr-only" th:text="#{ui.layout.openUserMenu}">Open user menu</span>
                </button>
                <div id="user-menu" x-show="open" x-transition.origin.top.right x-cloak
                     class="theme-surface theme-border absolute right-0 top-[calc(100%+1.25rem)] z-50 w-64 rounded-box border p-2 shadow-xl">
                    <div class="px-3 py-2">
                        <p class="truncate text-sm font-medium" th:text="${viewer.email}">owner@example.com</p>
                        <p class="text-xs text-slate-500" th:text="#{${viewer.roleLabelKey}}">Administrator</p>
                    </div>
                    <div class="divider my-1"></div>
                    <p class="px-3 pb-1 text-xs font-semibold uppercase tracking-wider text-slate-500"
                       th:text="#{ui.layout.language}">Language</p>
                    <!--/* One form per language, so choosing one needs no JavaScript at all. */-->
                    <form method="post" th:action="@{/settings/ui-locale}" th:each="option : ${uiLocaleOptions}">
                        <input type="hidden" name="uiLocale" th:value="${option.tag}">
                        <button type="submit" class="btn btn-ghost btn-sm w-full justify-start"
                                th:classappend="${option.tag == currentUiLocale} ? 'font-bold'"
                                th:attr="aria-current=${option.tag == currentUiLocale} ? 'true'"
                                th:text="${option.displayName}">English</button>
                    </form>
                    <div class="divider my-1"></div>
                    <form method="post" th:action="@{/logout}">
                        <button type="submit" class="btn btn-ghost btn-sm w-full justify-start"
                                th:text="#{ui.layout.signOut}">Sign out</button>
                    </form>
                </div>
            </div>
        </header>

        <main id="page-content" class="mx-auto w-full max-w-[1600px] p-4 lg:p-8" tabindex="-1">
            <!--/* What the last action did, carried across its redirect. Every page shows it
                   here, so no page can forget to. */-->
            <div class="toast-region" th:if="${notice != null}" th:aria-label="#{ui.common.notifications}" aria-label="Notifications">
                <div th:replace="~{fragments/toast :: toast(${notice.look()}, ${#messages.msgWithParams(notice.key(), notice.args())})}">Saved.</div>
            </div>
            <div layout:fragment="content"></div>
        </main>
    </div>

    <div class="drawer-side z-40" @keydown.escape.stop.prevent="close(true)">
        <div class="drawer-overlay" aria-hidden="true" @click="close(true)"></div>
        <aside id="app-sidebar" x-ref="panel" class="app-sidebar flex min-h-full w-72 flex-col border-r"
               :role="open ? 'dialog' : null" :aria-modal="open ? 'true' : null"
               th:aria-label="#{ui.layout.primaryNavigation}" aria-label="Primary navigation"
               @keydown.tab="trapFocus($event)">
            <div class="app-sidebar-divider flex h-16 items-center border-b">
                <a th:href="@{/}" class="flex h-full min-w-0 flex-1 items-center gap-3 px-6 py-2">
                    <span class="app-sidebar-brand-content min-w-0">
                        <span th:replace="~{fragments/brand :: logo('h-7 max-w-full')}"></span>
                        <small class="app-sidebar-muted block leading-tight" th:text="#{ui.layout.tagline}">Release notes workspace</small>
                    </span>
                </a>
                <button x-ref="close" type="button" class="icon-button mr-2 lg:hidden" @click="close(true)"
                        data-mobile-navigation-close
                        th:aria-label="#{ui.layout.closeNavigation}" aria-label="Close navigation">
                    <svg class="icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#close}"></use></svg>
                </button>
            </div>
            <form method="get" class="app-sidebar-divider grid grid-cols-[minmax(0,1fr)_auto] gap-2 border-b p-4 sm:hidden"
                  th:action="@{${projectSwitchPath}}" th:unless="${#lists.isEmpty(projectSwitcher)}" novalidate>
                <label class="col-span-2 text-xs font-semibold uppercase tracking-wider text-slate-500"
                       for="project-switcher-mobile" th:text="#{ui.overview.switchProjectLabel}">Switch project</label>
                <select id="project-switcher-mobile" name="project" class="select select-bordered select-sm min-w-0">
                    <option th:each="option : ${projectSwitcher}" th:value="${option.id()}"
                            th:text="${option.name()}" th:selected="${option.selected()}">Checkout</option>
                </select>
                <button type="submit" class="btn btn-outline btn-sm" th:text="#{ui.overview.switch}">Switch</button>
            </form>
            <nav class="flex-1 space-y-1 p-4" th:aria-label="#{ui.layout.primaryNavigation}" aria-label="Primary">
                <p class="app-sidebar-muted px-3 pb-2 pt-3 text-xs font-semibold uppercase tracking-widest"
                   th:text="#{ui.layout.workspace}">Workspace</p>
                <a th:href="@{/}" class="app-nav-link" th:classappend="${currentPath == '/'} ? 'is-active'"
                   th:attr="aria-current=${currentPath == '/'} ? 'page'"><svg class="app-nav-icon icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#overview}"></use></svg><span th:text="#{ui.nav.overview}">Overview</span></a>
                <a th:href="@{/changes}" class="app-nav-link" th:classappend="${#strings.startsWith(currentPath, '/changes')} ? 'is-active'"
                   th:attr="aria-current=${#strings.startsWith(currentPath, '/changes')} ? 'page'"><svg class="app-nav-icon icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#inbox}"></use></svg><span th:text="#{ui.nav.changes}">Change Inbox</span></a>
                <a th:href="@{/releases}" class="app-nav-link"
                   th:with="active=${#strings.startsWith(currentPath, '/releases') or #strings.contains(currentPath, '/releases/')}"
                   th:classappend="${active} ? 'is-active'"
                   th:attr="aria-current=${active} ? 'page'"><svg class="app-nav-icon icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#releases}"></use></svg><span th:text="#{ui.nav.releases}">Releases</span></a>
                <a th:href="@{/projects}" class="app-nav-link"
                   th:with="active=${#strings.startsWith(currentPath, '/projects') and !#strings.contains(currentPath, '/releases')}"
                   th:classappend="${active} ? 'is-active'"
                   th:attr="aria-current=${active} ? 'page'"><svg class="app-nav-icon icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#settings}"></use></svg><span th:text="#{ui.nav.projects}">Projects</span></a>
                <a th:href="@{/glossary}" class="app-nav-link"
                   th:with="active=${#strings.startsWith(currentPath, '/glossary')}"
                   th:classappend="${active} ? 'is-active'"
                   th:attr="aria-current=${active} ? 'page'"><svg class="app-nav-icon icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#glossary}"></use></svg><span th:text="#{ui.nav.glossary}">Glossary</span></a>
                <a th:href="@{/members}" class="app-nav-link" th:if="${viewer != null and viewer.admin}"
                   th:with="active=${#strings.startsWith(currentPath, '/members')}"
                   th:classappend="${active} ? 'is-active'"
                   th:attr="aria-current=${active} ? 'page'"><svg class="app-nav-icon icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#members}"></use></svg><span th:text="#{ui.nav.members}">Members</span></a>
                <a th:href="@{/audiences}" class="app-nav-link" th:if="${viewer != null and viewer.admin}"
                   th:with="active=${#strings.startsWith(currentPath, '/audiences')}"
                   th:classappend="${active} ? 'is-active'"
                   th:attr="aria-current=${active} ? 'page'"><svg class="app-nav-icon icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#audiences}"></use></svg><span th:text="#{ui.nav.audiences}">Audiences</span></a>
                <a th:href="@{/categories}" class="app-nav-link" th:if="${viewer != null and viewer.admin}"
                   th:with="active=${#strings.startsWith(currentPath, '/categories')}"
                   th:classappend="${active} ? 'is-active'"
                   th:attr="aria-current=${active} ? 'page'"><svg class="app-nav-icon icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#compare}"></use></svg><span th:text="#{ui.nav.categories}">Categories</span></a>
                <a th:href="@{/automation}" class="app-nav-link" th:if="${viewer != null and viewer.admin}"
                   th:with="active=${#strings.startsWith(currentPath, '/automation')}"
                   th:classappend="${active} ? 'is-active'"
                   th:attr="aria-current=${active} ? 'page'"><svg class="app-nav-icon icon" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#automation}"></use></svg><span th:text="#{ui.nav.automation}">Automation</span></a>
            </nav>
            <div class="app-sidebar-divider border-t p-4">
                <div class="subtle-panel flex items-start gap-3 p-3">
                    <svg class="icon mt-0.5 text-indigo-600" aria-hidden="true"><use th:href="@{/svg/ui-icons.svg#sparkles}"></use></svg>
                    <p class="app-sidebar-muted text-xs leading-5" th:text="#{ui.layout.promise}">AI drafts once.</p>
                </div>
            </div>
        </aside>
    </div>
</div>

<script th:src="@{/js/app.js}" defer></script>
<script th:src="@{/webjars/alpinejs/dist/cdn.min.js}" defer></script>
</body>
</html>
