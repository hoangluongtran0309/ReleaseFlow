<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* The reviewer confirms explicit values, so a stale page never approves a classification it did not show. */-->
<form th:fragment="reviewForm(change)" method="post" th:aria-label="#{ui.reviewForm.label}" aria-label="Review classification"
      class="grid gap-3 sm:grid-cols-[minmax(0,16rem)_auto_auto] sm:items-end"
      th:action="@{/projects/{projectId}/changes/{changeId}/review(projectId=${selectedProjectId},changeId=${change.id})}"
      th:object="${reviewRequest}" th:with="reviewFailing=${failingChangeId == change.id}" novalidate>
    <input type="hidden" name="returnCategory" th:value="${selectedCategory}">
    <input type="hidden" name="returnStatus" th:value="${selectedStatus}">
    <input type="hidden" name="returnContext" th:value="${selectedContext}">
    <input type="hidden" name="returnRelease" th:value="${selectedRelease}">
    <!--/* An unticked box sends nothing; the marker tells the binder it means false. */-->
    <input type="hidden" name="_breaking" value="on">
    <label class="form-control"><span class="label-text font-medium" th:text="#{ui.reviewForm.category}">Category</span>
        <select name="category" class="select select-bordered select-sm w-full" required
                th:with="categoryFailing=${reviewFailing and #fields.hasErrors('category')}"
                th:classappend="${categoryFailing} ? 'select-error'"
                th:attr="aria-invalid=${categoryFailing} ? 'true' : null,aria-describedby=${categoryFailing} ? |review-${change.id}-category-error| : null">
            <option value="" disabled th:selected="${change.unknownCategory()}" th:text="#{ui.reviewForm.chooseCategory}">Choose a category</option>
            <option th:each="option : ${reviewCategories}"
                    th:value="${option.code}" th:text="${option.displayName}"
                    th:selected="${option.code == change.category}">Feature</option>
        </select>
        <th:block th:if="${reviewFailing}"><th:block th:replace="~{fragments/form :: fieldError('category', |review-${change.id}-category-error|)}"></th:block></th:block>
    </label>
    <label class="label cursor-pointer justify-start gap-2">
        <input type="checkbox" name="breaking" value="true" class="checkbox checkbox-sm" th:checked="${change.breaking}">
        <span class="label-text" th:text="#{ui.reviewForm.breaking}">Breaking change</span>
    </label>
    <button type="submit" class="btn btn-primary btn-sm" th:text="#{ui.reviewForm.confirm}">Confirm review</button>
</form>
</body>
</html>
