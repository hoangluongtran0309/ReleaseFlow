# Labels of the release note written for each audience. Values with arguments are
# java.text.MessageFormat patterns; the others are used as they are.
title=Release {0}
whatsNew=What's New
overview=This release includes {0,choice,1#1 change|1<{0,number,integer} changes}: {1}.
breakingWarning=⚠️ {0,choice,1#1 breaking change requires|1<{0,number,integer} breaking changes require} action before upgrading.
# The same warning when the release links an upgrade guide (ADR-0037); {1} is its address.
breakingWarning.guide=⚠️ {0,choice,1#1 breaking change requires|1<{0,number,integer} breaking changes require} action before upgrading: [read the upgrade guide]({1}).
# Put before a breaking change that is also a security change, which appears once, in Breaking.
securityMarker=🔒 Security:
# The one line of a note whose audience nothing in the release concerns (ADR-0035).
nothingForAudience=Nothing in this release concerns this audience.
section.BREAKING=⚠️ Breaking Changes
section.SECURITY=🔒 Security
section.FEATURES=✨ New Features
section.FIXES=🐛 Bug Fixes
section.PERFORMANCE=⚡ Performance
section.DOCUMENTATION=📚 Documentation
section.MAINTENANCE=🔧 Maintenance
section.OTHER=Other Changes
count.BREAKING={0,choice,1#1 breaking change|1<{0,number,integer} breaking changes}
count.SECURITY={0,choice,1#1 security change|1<{0,number,integer} security changes}
count.FEATURES={0,choice,1#1 new feature|1<{0,number,integer} new features}
count.FIXES={0,choice,1#1 bug fix|1<{0,number,integer} bug fixes}
count.PERFORMANCE={0,choice,1#1 performance improvement|1<{0,number,integer} performance improvements}
count.DOCUMENTATION={0,choice,1#1 documentation update|1<{0,number,integer} documentation updates}
count.MAINTENANCE={0,choice,1#1 maintenance change|1<{0,number,integer} maintenance changes}
count.OTHER={0,choice,1#1 other change|1<{0,number,integer} other changes}
# Joining counts: two items, the separator for longer lists, and the last item.
list.pair={0} and {1}
list.middle={0}, {1}
list.last={0}, and {1}
